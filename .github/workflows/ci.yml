name: CI

on:
  push:
    branches: [main, master, dev]
    paths:
      - 'src/**'
      - 'frontend/src/**'
      - 'tests/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/**'
  pull_request:
    branches: [main, master]
    paths:
      - 'src/**'
      - 'frontend/src/**'
      - 'tests/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/**'
  # The SPA is served by FastAPI from frontend/dist, so a deploy without a
  # bundle leaves the API ahead of the interface. Being able to publish a
  # bundle on demand is what makes that recoverable without a code push.
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Install dependencies
        run: uv sync --extra dev
      - name: Ruff check
        run: uv run ruff check .
      - name: MyPy type check
        run: uv run mypy src/

  test:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Install dependencies
        run: uv sync --extra dev
      - name: Install pytest-cov
        run: uv pip install pytest-cov
      - name: Run tests with coverage
        run: uv run pytest tests/ -v --cov=src/ --cov-branch --cov-fail-under=80

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Vue type check
        run: npx vue-tsc --noEmit
      - name: Vitest run
        run: npx vitest run

  # Build the SPA and commit it onto dev, at spa-bundle/, so the deploy can
  # install it without node on the production host.
  #
  # `needs: [lint, test, frontend]` is the point of this job: a bundle is only
  # published from a commit whose Python and frontend checks both passed. The
  # alternative — building in the deploy — had no such gate, because the
  # production host ran no checks at all.
  spa-bundle:
    needs: [lint, test, frontend]
    runs-on: ubuntu-latest
    permissions:
      contents: write   # required to push the bundle commit onto dev
    steps:
      - uses: actions/checkout@v4
        with:
          # The bundle records the SHA it was built from, and the deploy asserts
          # it against the commit being deployed. It is also committed as a
          # child of the branch tip, so the tip has to be a real commit and not
          # a grafted one.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: frontend
      - name: Build, and publish the bundle onto dev
        # Only a push to dev publishes. The bundle is committed *on* the branch,
        # so a bundle built on any other ref would either be rejected as a
        # non-fast-forward or, worse, land on a tree whose sources are not the
        # ones it was built from. Other triggers still build it, so a broken
        # build is caught everywhere, not just on dev.
        if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
        run: scripts/frontend/publish_dist.sh
      - name: Build only (not publishing)
        if: ${{ !(github.event_name == 'push' && github.ref == 'refs/heads/dev') }}
        run: SKIP_PUBLISH=1 scripts/frontend/publish_dist.sh
      - name: Verify what dev now carries
        # Re-derived here rather than read from the publish step's own report:
        # a check that trusts the thing it is checking proves nothing. The
        # publish step has three honest outcomes and each is asserted
        # differently, because "the bundle matches this run" is only true for
        # one of them.
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/dev' }}
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          outcome="$(sed -n 's/^outcome=//p' .publish-outcome)"
          echo "publish outcome: ${outcome:-<none>}"

          # Read the bundle out of the pushed branch, not out of the working
          # tree: this is what checks what was actually published.
          git fetch --quiet origin dev
          bundle_commit="$(git log -1 --format=%H origin/dev -- spa-bundle)"
          if [ -z "${bundle_commit}" ]; then
            echo "::error::dev carries no spa-bundle/ after this run"
            exit 1
          fi
          published_sha="$(git show "origin/dev:spa-bundle/.build-info.json" \
                          | sed -n 's/.*"source_sha": *"\([0-9a-f]*\)".*/\1/p')"
          echo "dev carries bundle ${bundle_commit} from source ${published_sha}"

          # The post-condition, checked with git's own tree comparison rather
          # than by re-hashing the frontend sources: if no frontend file differs
          # between the commit that last wrote the bundle and the branch tip,
          # then that bundle was built from exactly these sources.
          #
          # `git diff -- frontend` is a complete statement here precisely
          # because dist/ and node_modules/ are gitignored and spa-bundle/ sits
          # at the repository root: the pathspec sees source files and nothing
          # else. Re-deriving the hash with a third copy of publish_dist.sh's
          # exclusion filter would be the alternative, and duplicated filters are
          # how the two sides of this comparison drift apart — the deploy
          # script's copy of that filter already carries a comment about it.
          if ! git diff --quiet "${bundle_commit}" origin/dev -- frontend; then
            echo "::error::frontend sources differ between the bundle commit and dev:"
            git --no-pager diff --stat "${bundle_commit}" origin/dev -- frontend
            exit 1
          fi
          echo "PASS: dev's bundle matches dev's frontend sources"

          case "${outcome}" in
            published)
              if [ "${published_sha}" != "${sha}" ]; then
                echo "::error::outcome says published, but dev's bundle is from ${published_sha}, not ${sha}"
                exit 1
              fi
              echo "PASS: published from this run"
              ;;
            skipped-frontend-unchanged)
              # Nothing to compare against this run: the build produced a bundle
              # byte-identical to the one already on dev, which is why it was not
              # committed. The diff above is what establishes dev is current.
              echo "PASS: frontend unchanged, dev's existing bundle is current"
              ;;
            *)
              echo "::error::unexpected publish outcome '${outcome}' on a push to dev"
              exit 1
              ;;
          esac

  # AC-12: 无头仿真输出 JUnit 报告并接入流水线（§7.11）
  # 在 ATE_SIMULATION_MODE=true 下以纯仿真方式运行 v3.2 生产序列，
  # 生成 JUnit XML 上传 artifact 供 Jenkins/GitLab 消费。
  headless-sim:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Install dependencies
        run: uv sync --extra dev
      - name: Headless simulation tests (JUnit)
        run: |
          ATE_SIMULATION_MODE=true uv run pytest \
            tests/integration/test_headless_simulation.py \
            tests/unit/dsl/ -v --junitxml=reports/sim-unit-junit.xml
      - name: Run v3.2 production sequence headless (full tier)
        run: |
          ATE_SIMULATION_MODE=true uv run python -m \
            ate_platform.simulation.headless_runner \
            tests/fixtures/plan_v32_production.yaml \
            --tier full --junit reports/sim-v32-full.xml
      - name: Run v3.2 production sequence headless (dry_run tier)
        run: |
          ATE_SIMULATION_MODE=true uv run python -m \
            ate_platform.simulation.headless_runner \
            tests/fixtures/plan_v32_production.yaml \
            --tier dry_run --junit reports/sim-v32-dryrun.xml
      - name: Run v3.2 production sequence headless (v32 semantic tier)
        run: |
          ATE_SIMULATION_MODE=true uv run python -m \
            ate_platform.simulation.headless_runner \
            tests/fixtures/plan_v32_production.yaml \
            --tier v32 --junit reports/sim-v32-semantic.xml
      - name: Upload headless simulation JUnit reports
        uses: actions/upload-artifact@v4
        with:
          name: headless-sim-reports
          path: reports/
          if-no-files-found: error

  security:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync
      - name: Install bandit
        run: uv pip install bandit
      - name: Bandit security scan
        run: uv run bandit -r src/ -ll