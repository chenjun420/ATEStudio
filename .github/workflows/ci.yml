name: CI

on:
  push:
    branches: [main, master]
    paths:
      - 'src/**'
      - 'frontend/src/**'
      - 'tests/**'
      - 'pyproject.toml'
  pull_request:
    branches: [main, master]
    paths:
      - 'src/**'
      - 'frontend/src/**'
      - 'tests/**'
      - 'pyproject.toml'

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Install dependencies
        run: uv sync --group dev
      - name: Ruff check
        run: uv run ruff check .
      - name: MyPy type check
        run: uv run mypy src/

  test:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Install dependencies
        run: uv sync --group dev
      - name: Install pytest-cov
        run: uv pip install pytest-cov
      - name: Run tests with coverage
        run: uv run pytest tests/ -v --cov=src/ --cov-branch --cov-fail-under=80

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Vue type check
        run: npx vue-tsc --noEmit
      - name: Vitest run
        run: npx vitest run

  # AC-12: 无头仿真输出 JUnit 报告并接入流水线（§7.11）
  # 在 ATE_SIMULATION_MODE=true 下以纯仿真方式运行 v3.2 生产序列，
  # 生成 JUnit XML 上传 artifact 供 Jenkins/GitLab 消费。
  headless-sim:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Install dependencies
        run: uv sync --group dev
      - name: Headless simulation tests (JUnit)
        run: |
          ATE_SIMULATION_MODE=true uv run pytest \
            tests/integration/test_headless_simulation.py \
            tests/unit/dsl/ -v --junitxml=reports/sim-unit-junit.xml
      - name: Run v3.2 production sequence headless (full tier)
        run: |
          ATE_SIMULATION_MODE=true uv run python -m \
            ate_platform.simulation.headless_runner \
            tests/fixtures/plan_v32_production.yaml \
            --tier full --junit reports/sim-v32-full.xml
      - name: Run v3.2 production sequence headless (dry_run tier)
        run: |
          ATE_SIMULATION_MODE=true uv run python -m \
            ate_platform.simulation.headless_runner \
            tests/fixtures/plan_v32_production.yaml \
            --tier dry_run --junit reports/sim-v32-dryrun.xml
      - name: Upload headless simulation JUnit reports
        uses: actions/upload-artifact@v4
        with:
          name: headless-sim-reports
          path: reports/
          if-no-files-found: error

  security:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync
      - name: Install bandit
        run: uv pip install bandit
      - name: Bandit security scan
        run: uv run bandit -r src/ -ll