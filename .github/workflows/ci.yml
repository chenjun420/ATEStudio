name: CI

on:
  push:
    # main and dev only. `master` was removed when the repositories were unified
    # onto main (release) + dev (development); leaving it listed would silently
    # skip every push to a branch that no longer exists.
    branches: [main, dev]
    paths:
      - 'src/**'
      - 'frontend/src/**'
      - 'tests/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/**'
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'frontend/src/**'
      - 'tests/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/**'
  # Re-run on demand.
  #
  # The SPA bundle is no longer published from CI: it is built on the control
  # machine by scripts/frontend/build_bundle.sh and shipped by scp, because an
  # 18 MB bundle of hashed assets does not belong in the git object store. What CI
  # still owes the build is the `Production build` step in the frontend job — the
  # only place a real production build is exercised, since the deploy machine is
  # the worst place to discover vite is broken.
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Install dependencies
        run: uv sync --extra dev
      - name: Ruff check
        run: uv run ruff check .
      - name: MyPy type check
        run: uv run mypy src/

  test:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Install dependencies
        run: uv sync --extra dev
      - name: Run tests with coverage
        run: uv run pytest tests/ -v --cov=src/ --cov-branch --cov-fail-under=80

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Vue type check
        run: npx vue-tsc --noEmit
      - name: Vitest run
        run: npx vitest run
      # The bundle the deploy installs is built on the machine that runs the
      # deploy, not here, so this is the only place the production bundle's
      # build ever gets exercised. Without it a broken vite build would pass CI
      # and fail on the control machine at deploy time, which is the worst place
      # to find out.
      - name: Production build
        run: npm run build
  # AC-12: 无头仿真输出 JUnit 报告并接入流水线（§7.11）
  # 在 ATE_SIMULATION_MODE=true 下以纯仿真方式运行 v3.2 生产序列，
  # 生成 JUnit XML 上传 artifact 供 Jenkins/GitLab 消费。
  headless-sim:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Install dependencies
        run: uv sync --extra dev
      - name: Headless simulation tests (JUnit)
        run: |
          ATE_SIMULATION_MODE=true uv run pytest \
            tests/integration/test_headless_simulation.py \
            tests/unit/dsl/ -v --junitxml=reports/sim-unit-junit.xml
      - name: Run v3.2 production sequence headless (full tier)
        run: |
          ATE_SIMULATION_MODE=true uv run python -m \
            ate_platform.simulation.headless_runner \
            tests/fixtures/plan_v32_production.yaml \
            --tier full --junit reports/sim-v32-full.xml
      - name: Run v3.2 production sequence headless (dry_run tier)
        run: |
          ATE_SIMULATION_MODE=true uv run python -m \
            ate_platform.simulation.headless_runner \
            tests/fixtures/plan_v32_production.yaml \
            --tier dry_run --junit reports/sim-v32-dryrun.xml
      - name: Run v3.2 production sequence headless (v32 semantic tier)
        run: |
          ATE_SIMULATION_MODE=true uv run python -m \
            ate_platform.simulation.headless_runner \
            tests/fixtures/plan_v32_production.yaml \
            --tier v32 --junit reports/sim-v32-semantic.xml
      - name: Upload headless simulation JUnit reports
        uses: actions/upload-artifact@v4
        with:
          name: headless-sim-reports
          path: reports/
          if-no-files-found: error

  security:
    runs-on: ubuntu-latest
    # No continue-on-error. The job carried it while bandit reported 22 medium
    # findings on every run, which made it a job that could not fail and
    # therefore a job nobody had to read. Those findings are now either marked
    # at the site with a reason or actually fixed — ATML XML parsing moved to
    # defusedxml — so the scan is clean and can gate again.
    #
    # Installs the dev extra because bandit lives there now. It used to be
    # pip-installed by a step below, which left its version unrecorded in
    # uv.lock: a scanner whose version floats is a scanner whose findings change
    # without a commit.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Install dependencies
        run: uv sync --extra dev
      - name: Bandit security scan
        run: uv run bandit -r src/ -ll