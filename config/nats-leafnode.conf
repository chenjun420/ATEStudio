# NATS Leaf Node Configuration for ATE Studio Edge Worker
#
# This leaf node provides:
#   - Local NATS server on port 4222 for edge workers
#   - Local JetStream persistence (survives WAN outages)
#   - Leaf node remote connection to cloud NATS (auto-reconnect)
#   - Server tags for identification
#
# When WAN drops:
#   1. Local workers continue operating (local NATS + JetStream)
#   2. Messages buffer in local JetStream store_dir
#   3. On WAN reconnect, buffered messages sync upstream
#
# Usage:
#   nats-server -c config/nats-leafnode.conf

port: 4222

jetstream {
    store_dir: "/data/jetstream-leaf"
    max_memory: 256MB
}

leafnodes {
    remotes: [
        {
            url: "nats://cloud-nats:4222"
            account: "ate"
        }
    ]
}

server_tags: ["edge", "station"]
