# NATS Server Configuration for ATE Studio (JetStream file storage)
#
# Cloud/central NATS server template with explicit FILE storage for
# JetStream (design doc §5/§10.5 - offline event persistence).
#
# What this provides:
#   - Core NATS on port 4222, monitoring on 8222
#   - JetStream with FILE storage backend (durable across restarts)
#   - store_dir pinned to /var/lib/nats/jetstream so a named volume
#     can be mounted there (docker-compose.yml: nats-jetstream-data)
#
# Streams created by the platform (e.g. TESTSTATION_EVENTS) inherit the
# server-level file storage; clients that declare streams explicitly
# use StorageType.File as well (src/ate_platform/offline/event_buffer.py).
#
# Usage:
#   nats-server -c config/nats-server.conf
#
# Docker (docker-compose.yml mounts a named volume at this path):
#   store_dir: /var/lib/nats/jetstream

port: 4222

# `http: 8222` is the 2.9+ spelling. The older `http_monitor_port` key was
# removed in 2.10, and this file is loaded by the nats image in
# docker-compose.yml, so the old spelling made the server refuse to start
# (verified against nats-server v2.10.28).
#
# Bound to loopback on purpose. The monitoring endpoint is unauthenticated —
# /connz, /jsz, /routez with no credentials — and it carries subject names,
# client IPs and JetStream layout. On a factory LAN that is reconnaissance for
# anyone who can reach the port, and CVE-2026-28 (Connz pagination integer
# overflow) is a pre-auth remote crash reachable through exactly this
# endpoint. Nothing outside the host needs it; the container healthcheck runs
# inside the container, so localhost still satisfies it.
#
# Do not re-add `-m 8222` to the compose `command:` — CLI flags override this
# file, which would silently put the listener back on 0.0.0.0.
http: 127.0.0.1:8222

jetstream {
    # Explicit FILE storage - messages persist across server restarts.
    store_dir: "/var/lib/nats/jetstream"
    # `max_mem` is the current key; `max_memory` is a long-removed alias.
    max_mem: 256MB
    max_file: 1GB
}

server_tags: ["cloud", "atestudio"]
