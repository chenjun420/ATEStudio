[project]
name = "atestudio"
version = "0.1.0"
description = "ATE Studio - Automated Test Engineering Platform"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "simpleeval>=1.0.0",
    "pyyaml>=6.0.0",
    "pyvisa>=1.13.0",
    "pyvisa-py>=0.7.0",
    "aiosqlite>=0.20.0",
    "nats-py>=2.0.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic-settings>=2.0.0",
    "httpx>=0.27.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.29.0",
    "aiomysql>=0.2.0",
    "alembic>=1.13.0",
    "sse-starlette>=2.0.0",
    "gitpython>=3.1.0",
    "qdrant-client>=1.12.0",
    "langchain-openai>=0.2.0",
    "langchain-core>=0.3.0",
    # Knowledge graph backend: FalkorDB (Redis-compatible, RESP/6379).
    # semantica graph-falkordb extra provides the GraphStore/GraphBuilder
    # integration used by later KG tasks; falkordb is the async client
    # (falkordb.asyncio) behind the GraphService protocol. Neo4j drivers
    # (neo4j, langchain-neo4j) were removed in favor of FalkorDB.
    # graph-falkordb: GraphStore/GraphBuilder integration; shacl: pyshacl for
    # ontology SHACL graph validation (OWL export only needs rdflib, a semantica
    # core dep). pyshacl is imported lazily inside the ontology service — the
    # app boots without it; validation degrades to OntologyServiceUnavailable.
    "semantica[graph-falkordb,shacl]>=0.6.7",
    "falkordb>=1.7.1",
    "pyjwt>=2.8.0",
    "pwdlib[argon2]>=0.0.1",
    "cryptography>=42.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "syrupy>=4.6.0",
    "hypothesis>=6.100.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]
openhtf = [
    "openhtf>=0.12.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ate_platform"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4"]
ignore = ["B024"]  # Abstract class without abstract methods is intentional

# str+Enum mixins (UP042) are intentional: these enums serialize as plain
# strings over JSON/NATS payloads and renaming the mixin risks contract drift.
[tool.ruff.lint.per-file-ignores]
"src/shared/fixture_topology.py" = ["UP042"]
"src/ate_cloud/services/ontology/vocab.py" = ["UP042"]
"src/ate_cloud/config.py" = ["UP042"]
"src/shared/measurement.py" = ["UP042"]
# Intentional re-export barrel: imports follow package init code and are the
# public surface of the package (F401 unused-import is expected).
"src/ate_cloud/models/__init__.py" = ["E402", "F401"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI dependency-injection calls in argument defaults are the framework's
# intended usage, not the mutable-default bug B008 guards against.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Security",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Body",
    "fastapi.Header",
    "fastapi.Cookie",
    "fastapi.Form",
    "fastapi.File",
    "fastapi.HTTPBearer",
    "ate_cloud.auth.dependencies.require_scopes",
]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
[[tool.mypy.overrides]]
module = ["pyvisa", "pyvisa.*", "nats", "nats.*", "aiosqlite", "httpx", "sqlalchemy", "sqlalchemy.*", "asyncpg", "git", "git.*", "grpc", "grpc.*", "google.protobuf", "google.protobuf.*", "simpleeval", "simpleeval.*", "falkordb", "falkordb.*", "semantica", "semantica.*"]
ignore_missing_imports = true

# Dynamic protobuf message classes (built at runtime via descriptor_pool +
# message_factory) are not statically visible to mypy — they appear as plain
# variables rather than types. Suppress the resulting type-check errors.
[[tool.mypy.overrides]]
module = ["ate_platform.drivers.grpc.protocol", "ate_platform.drivers.grpc.grpc_driver_stub", "ate_platform.drivers.grpc.instrument_server"]
disable_error_code = ["valid-type", "attr-defined", "no-any-return", "misc", "unused-ignore"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
# Real remote-service integration tests (tests/integration/test_* real-service
# modules) carry the `integration` marker. They are SKIPPED BY DEFAULT by the
# env gate in tests/integration/conftest.py: they only run when
# ATE_RUN_INTEGRATION is truthy, and even then each test skips cleanly when its
# specific remote service (NATS/Qdrant/FalkorDB/nginx on 192.168.5.24 or
# ATE_INTEGRATION_HOST) is unreachable. The marker is registered here so
# pytest emits no unknown-marker warning.
markers = [
    "integration: real remote-service integration test against the debug server (gated by ATE_RUN_INTEGRATION; skipped by default)",
]