[project]
name = "atestudio"
version = "0.1.0"
description = "ATE Studio - Automated Test Engineering Platform"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "simpleeval>=1.0.0",
    "pyyaml>=6.0.0",
    "pyvisa>=1.13.0",
    "pyvisa-py>=0.7.0",
    "aiosqlite>=0.20.0",
    "nats-py>=2.0.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic-settings>=2.0.0",
    "httpx>=0.27.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.29.0",
    "aiomysql>=0.2.0",
    "alembic>=1.13.0",
    "sse-starlette>=2.0.0",
    "gitpython>=3.1.0",
    "qdrant-client>=1.12.0",
    "langchain-openai>=0.2.0",
    "langchain-core>=0.3.0",
    # P4 Agent face (D2): create_agent + MCP client against ATERag's read-only
    # MCP server. Pinned to the 1.x line because langchain pre-1.0 had minor
    # breaking changes in the agent API, and a factory test platform should not
    # track that churn.
    "langchain>=1.0.0",
    "langchain-mcp-adapters>=0.1.0",
    "mcp>=1.2.0",
    # Two direct imports that were never declared here, and only reached the venv
    # because `semantica` happened to depend on both. Removing the knowledge-graph
    # subsystem removed semantica, and the app on the deployed host stopped
    # importing at all — `state_snapshot.py` does `import structlog` at module
    # level. A package you import directly and do not declare is one `uv lock`
    # refresh away from vanishing, and nothing in the test suite could see it,
    # because the local environment already had it.
    "structlog>=24.1.0",
    # Same story, quieter outcome: report_exporter.py imports pyarrow inside a
    # try/except to offer Parquet export and falls back to CSV when it is
    # absent. That fallback worked, so the Parquet path went from working to
    # silently not working — the worst kind, because a caller asking for
    # Parquet got CSV and a log line nobody reads. Declared so the capability
    # is a decision rather than an accident of someone else's dependency list.
    "pyarrow>=15.0.0",
    # Parses externally-supplied ATML — customer-authored test specifications,
    # so untrusted by definition. The stdlib parser rejects undefined entities but
    # still expands internal entity definitions, so a billion-laughs document still
    # parses, at the cost of the process's memory. defusedxml refuses the DTD
    # outright and turns the attempt into the same ATMLParseError → HTTP 400 that
    # any other malformed document gets.
    "defusedxml>=0.7.1",
    # The knowledge-graph backend is gone: semantica[graph-falkordb,shacl] and
    # falkordb were removed with the subsystem. Nothing imports either now.
    #
    # They were hard dependencies for a capability that never ran once: the
    # dependencies, the compose service, the provisioning script and the
    # operations manual were all present and correct, and FalkorDB was never
    # started, so every request against the graph failed to connect. Phase 1
    # does not need a graph — the DENSO/JST field study measured the RAG
    # baseline at F1@20 = 0.267 while already using an FMEA knowledge graph as
    # its data source, with the graph method reaching 0.523 only on a single
    # line across three scenarios. See the design spec §6.1.
    "pyjwt>=2.8.0",
    "pwdlib[argon2]>=0.0.1",
    "cryptography>=42.0.0",
    # pydantic is imported at module level by 53 files and was, until this line,
    # undeclared — it was only installed because fastapi and pydantic-settings
    # require it. That is the same shape as the structlog landmine that broke
    # the deployed service, one size larger, so it is declared rather than left
    # to a transitive.
    "pydantic>=2.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "syrupy>=4.6.0",
    "hypothesis>=6.100.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    # The tools CI runs, declared rather than pip-installed inside the workflow.
    # Both were being added by a `uv pip install` step in ci.yml, which means the
    # version that checked the code was whatever the index served that day and
    # nothing in the lock file recorded it. A tool whose version is not pinned is
    # a tool whose findings change without a commit.
    "bandit>=1.7.0",
    "pytest-cov>=5.0.0",
    # Stubs for a runtime dependency. PyYAML is used across the codebase and does
    # publish type information separately, so this buys real checking on every
    # `yaml.safe_load` rather than another line in the ignore list above. yaml
    # returns `Any`, so this is mostly about catching wrong argument names — which
    # is exactly the class of bug that reaches production as a silently empty
    # config.
    "types-PyYAML>=6.0.12",
    # Stubs for defusedxml, which is a runtime dependency of the ATML importer.
    # The stub package versions independently of the runtime one, so this is not
    # tied to defusedxml's version — 0.7.0.x is the current line.
    "types-defusedxml>=0.7.0",
]
openhtf = [
    "openhtf>=0.12.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ate_platform"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4"]
ignore = ["B024"]  # Abstract class without abstract methods is intentional

# str+Enum mixins (UP042) are intentional: these enums serialize as plain
# strings over JSON/NATS payloads and renaming the mixin risks contract drift.
[tool.ruff.lint.per-file-ignores]
"src/shared/fixture_topology.py" = ["UP042"]
"src/ate_cloud/services/ontology/vocab.py" = ["UP042"]
"src/ate_cloud/config.py" = ["UP042"]
"src/shared/measurement.py" = ["UP042"]
# Intentional re-export barrel: imports follow package init code and are the
# public surface of the package (F401 unused-import is expected).
"src/ate_cloud/models/__init__.py" = ["E402", "F401"]
# alembic's own shape: the logging setup must run before the model import, and
# env.py cannot be reshaped to avoid that without breaking
# `alembic revision --autogenerate`. Same reason as the barrel above.
"alembic/env.py" = ["E402"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI dependency-injection calls in argument defaults are the framework's
# intended usage, not the mutable-default bug B008 guards against.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Security",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Body",
    "fastapi.Header",
    "fastapi.Cookie",
    "fastapi.Form",
    "fastapi.File",
    "fastapi.HTTPBearer",
    "ate_cloud.auth.dependencies.require_scopes",
]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
# Third-party packages mypy cannot see, and must not be asked about twice.
#
# Each entry is here because the package is either not installed or ships no type
# information, so a missing-import error carries no signal: it says "this
# distribution is not present", which `tests/cloud/test_declared_dependencies.py`
# already checks properly — that test states *why* each one is acceptable, which
# a config file cannot. This list exists to stop mypy repeating a fact that is
# already recorded, and the two are kept in step deliberately.
#
# `yaml` is deliberately NOT here: PyYAML does ship stubs, so `types-PyYAML` is a
# declared dev dependency and yaml usage is genuinely checked.
#
# `opentelemetry` is the one to watch. It is declared nowhere and installed
# nowhere — not in pyproject.toml, not in uv.lock, not in the venv — so
# observability/telemetry.py cannot be imported in CI at all. The import-time
# failure that used to follow from that is fixed: observability/__init__.py reaches
# telemetry through a lazy PEP 562 __getattr__, so `import ate_cloud.observability`
# works on a host with no SDK while still refusing to hand out a telemetry function.
# This override is still needed, because the CI environment still has no SDK, and
# the capability itself is still unreachable — nothing in src/ calls
# setup_telemetry. See TRANSITIVE_BY_DESIGN in
# tests/cloud/test_declared_dependencies.py.
#
# `grpc.*` was here until 2026-10-02: only a bare `import grpc` exists, so the
# wildcard matched nothing and warn_unused_configs reported it every run.
[[tool.mypy.overrides]]
module = [
    "pyvisa", "pyvisa.*",
    "nats", "nats.*",
    "aiosqlite",
    "httpx",
    "sqlalchemy", "sqlalchemy.*",
    "asyncpg",
    "git", "git.*",
    "grpc",
    "google.protobuf", "google.protobuf.*",
    # no `simpleeval.*`: every import is `from simpleeval import ...`, and the
    # wildcard matched nothing, which warn_unused_configs reported every run
    "simpleeval",
    # declared and installed, but ships neither stubs nor a py.typed marker, and
    # none are published. report_exporter.py imports it inside a try/except with a
    # CSV fallback, so the boundary is already handled at runtime.
    "pyarrow", "pyarrow.*",
    # optional by design, guarded by _ORTOOLS_AVAILABLE with a heuristic fallback.
    # The submodule is listed because that is what the code imports
    # (`from ortools.sat.python import cp_model`), and mypy does not apply a
    # silenced parent to its submodules. Narrower than `ortools.*`, which matched
    # nothing and was reported unused on every run.
    "ortools.sat.python",
    # see the note above: a recorded gap, not a missing declaration
    "opentelemetry", "opentelemetry.*",
]
ignore_missing_imports = true

# Dynamic protobuf message classes (built at runtime via descriptor_pool +
# message_factory) are not statically visible to mypy — they appear as plain
# variables rather than types. Suppress the resulting type-check errors.
[[tool.mypy.overrides]]
module = ["ate_platform.drivers.grpc.protocol", "ate_platform.drivers.grpc.grpc_driver_stub", "ate_platform.drivers.grpc.instrument_server"]
disable_error_code = ["valid-type", "attr-defined", "no-any-return", "misc", "unused-ignore"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
# Real remote-service integration tests (tests/integration/test_* real-service
# modules) carry the `integration` marker. They are SKIPPED BY DEFAULT by the
# env gate in tests/integration/conftest.py: they only run when
# ATE_RUN_INTEGRATION is truthy, and even then each test skips cleanly when its
# specific remote service (NATS/Qdrant/nginx on 192.168.5.24 or
# ATE_INTEGRATION_HOST) is unreachable. The marker is registered here so
# pytest emits no unknown-marker warning.
markers = [
    "integration: real remote-service integration test against the debug server (gated by ATE_RUN_INTEGRATION; skipped by default)",
    "slow: shells out to uv; seconds rather than milliseconds",
]