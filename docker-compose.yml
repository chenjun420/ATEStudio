# =============================================================================
# ATE Studio - Docker Compose Deployment
#
# Profiles:
#   dev   — All services (ate-cloud + ate-platform + nats + qdrant + falkordb)
#   cloud — Cloud only (ate-cloud + nats + qdrant + falkordb, no ate-platform)
#
# Usage:
#   docker compose --profile dev up -d       # Full stack (development)
#   docker compose --profile cloud up -d     # Cloud-only deployment
#
# Environment variables (set in .env file or shell):
#   FALKORDB_PASSWORD            FalkorDB/Redis password (default: empty = no auth)
#   ATE_CLOUD_DATABASE_TYPE      sqlite | postgresql | mysql (default: sqlite)
#   ATE_CLOUD_EMBEDDING_DIMENSIONS  Embedding vector size (default: 1536)
#   ATE_SIMULATION_MODE          true | false (default: true for Docker)
# =============================================================================

name: ate-studio

services:
  # ---------------------------------------------------------------------------
  # NATS JetStream — Cloud-edge messaging (required, no silent degradation)
  # ---------------------------------------------------------------------------
  nats:
    profiles: [dev, cloud]
    image: nats:2.10-alpine
    # RH-2: explicit file-storage template (config/nats-server.conf) pins
    # store_dir to /var/lib/nats/jetstream; the named volume mounted there
    # makes JetStream state durable across container recreation.
    command: >-
      -js
      --config /etc/nats/nats-server.conf
      -m 8222
    ports:
      - "4222:4222"
      - "8222:8222"
    volumes:
      - ./config/nats-server.conf:/etc/nats/nats-server.conf:ro
      - nats-jetstream-data:/var/lib/nats/jetstream
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8222/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'
    networks:
      - ate-network

  # ---------------------------------------------------------------------------
  # Qdrant — Vector database for fault indexing and RAG (required)
  # ---------------------------------------------------------------------------
  qdrant:
    profiles: [dev, cloud]
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:
      - qdrant-data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:6333/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'
    networks:
      - ate-network

  # ---------------------------------------------------------------------------
  # FalkorDB — Knowledge graph for FMEA diagnostics (Redis RESP / 6379)
  # Image `falkordb/falkordb` bundles the graph server (RESP, 6379) and the
  # FalkorDB Browser UI (3000). Data dir is /data; persistence/auth are passed
  # through REDIS_ARGS. Health = Redis PING (same probe as the bare-metal run).
  # ---------------------------------------------------------------------------
  falkordb:
    profiles: [dev, cloud]
    image: falkordb/falkordb:latest
    ports:
      - "6379:6379"   # Redis RESP (graph queries via Cypher GRAPH.* commands)
      - "3000:3000"   # FalkorDB Browser UI
    volumes:
      - falkordb-data:/data
    environment:
      # AOF persistence passed through to the Redis server. To enable auth,
      # add `--requirepass <pw>` here AND set FALKORDB_PASSWORD in .env (the
      # cloud reads it via FALKORDB_URL/FALKORDB_PASSWORD); dev default = none.
      REDIS_ARGS: "--appendonly yes --appendfsync everysec"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 20s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
    networks:
      - ate-network

  # ---------------------------------------------------------------------------
  # ate-cloud — FastAPI cloud service (API, SSE, script versioning, RAG)
  # ---------------------------------------------------------------------------
  ate-cloud:
    profiles: [dev, cloud]
    build: .
    image: ate-studio:latest
    ports:
      - "8000:8000"
    volumes:
      - ate-scripts:/app/scripts
      - ate-data:/app/data
    environment:
      ATE_CLOUD_DATABASE_TYPE: ${ATE_CLOUD_DATABASE_TYPE:-sqlite}
      ATE_CLOUD_SQLITE_DB_PATH: /app/data/ate_platform.db
      ATE_CLOUD_NATS_URL: nats://nats:4222
      ATE_CLOUD_QDRANT_URL: http://qdrant:6333
      # FalkorDB graph DB (Redis RESP). Service name `falkordb`, port 6379;
      # graph key `fmea` matches FALKORDB_GRAPH default in src/ate_cloud/config.py.
      FALKORDB_URL: redis://falkordb:6379
      FALKORDB_GRAPH: fmea
      FALKORDB_PASSWORD: ${FALKORDB_PASSWORD:-}
      ATE_CLOUD_EMBEDDING_DIMENSIONS: ${ATE_CLOUD_EMBEDDING_DIMENSIONS:-1536}
      ATE_SIMULATION_MODE: ${ATE_SIMULATION_MODE:-true}
      SCRIPTS_ROOT_DIR: /app/scripts
    depends_on:
      nats:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      falkordb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8000/api/v1/health/db"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 40s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'
    networks:
      - ate-network

  # ---------------------------------------------------------------------------
  # ate-platform — Edge execution engine (JetStreamWorker)
  # Dev-only: edge workers run on production stations, not in cloud deploy
  # ---------------------------------------------------------------------------
  ate-platform:
    profiles: [dev]
    build: .
    image: ate-studio:latest
    command:
      - sh
      - -c
      - |
        python -c "
        import asyncio, os
        from ate_platform.scheduler.jetstream_worker import JetStreamWorker

        async def main():
            worker = JetStreamWorker(
                nats_url=os.environ.get('ATE_CLOUD_NATS_URL', 'nats://nats:4222')
            )
            await worker.start()
            print(f'JetStreamWorker {worker.worker_id} started')
            while True:
                await worker.pull_and_process_one(timeout=5.0)

        asyncio.run(main())
        "
    volumes:
      - ate-scripts:/app/scripts
      - ate-data:/app/data
    environment:
      ATE_CLOUD_NATS_URL: nats://nats:4222
      ATE_SIMULATION_MODE: ${ATE_SIMULATION_MODE:-true}
      ATE_PLATFORM_WORKER_ID_PATH: /app/data/worker_id
    depends_on:
      nats:
        condition: service_healthy
      ate-cloud:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import sys; sys.exit(0)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'
    networks:
      - ate-network

# =============================================================================
# Volumes — persistent data storage
# =============================================================================
volumes:
  nats-jetstream-data:  # NATS JetStream file storage (RH-2, /var/lib/nats/jetstream)
  qdrant-data:     # Qdrant vector index storage
  falkordb-data:   # FalkorDB graph database storage (Redis AOF/RDB, /data)
  ate-scripts:     # Shared test scripts (ate-cloud writes, ate-platform reads)
  ate-data:        # SQLite database + worker ID

# =============================================================================
# Network — custom bridge for service isolation
# =============================================================================
networks:
  ate-network:
    driver: bridge
