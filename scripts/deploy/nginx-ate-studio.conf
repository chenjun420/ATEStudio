# =============================================================================
# nginx site config — ATE Studio (ate-cloud + built Vue SPA)
# =============================================================================
# Canonical reverse-proxy / static-site config for the bare-metal deploy on
# 192.168.5.24 (Debian 12, nginx 1.22.1). The cloud service (ate-cloud.service)
# listens on 127.0.0.1:8000; nginx terminates HTTP on :80 and:
#   * serves the built Vue SPA static files (history mode -> try_files),
#   * reverse-proxies the REST API + Swagger docs to 127.0.0.1:8000,
#   * proxies Server-Sent-Events streams with buffering OFF (see below).
#
# This file contains NO secrets/credentials — the app reads those from its
# systemd EnvironmentFile (~/ATEStudio/.env.deploy), never from nginx.
#
# INSTALL (on the server, as root / via sudo):
#   sudo cp scripts/deploy/nginx-ate-studio.conf /etc/nginx/sites-available/ate-studio
#   #   edit `server_name` and `root` below for this host (search __CHANGEME__)
#   sudo ln -sf /etc/nginx/sites-available/ate-studio /etc/nginx/sites-enabled/ate-studio
#   # if the old site 'atestudio' is enabled, disable it to avoid a clash:
#   sudo rm -f /etc/nginx/sites-enabled/atestudio
#   sudo nginx -t
#   sudo systemctl reload nginx
#
# The SPA build output must exist at `root` (deploy the frontend first):
#   (cd frontend && npm ci && npm run build)   # produces frontend/dist
#   rsync frontend/dist/ -> <root>/
# =============================================================================

server {
    listen 80;
    listen [::]:80;

    # __CHANGEME_HOST__: set the real hostname/FQDN, or keep `_` as a catch-all.
    server_name _;

    # __CHANGEME_ROOT__: directory holding the built SPA (frontend/dist).
    # On .24 the deploy tree is /home/rpdzkj/ATEStudio, so:
    #   root /home/rpdzkj/ATEStudio/frontend/dist;
    root /home/CHANGE_ME_USER/ATEStudio/frontend/dist;
    index index.html;

    # Reasonable upload/body limit for script/ATML uploads.
    client_max_body_size 25m;

    # -------------------------------------------------------------------------
    # API — REST + SSE. The cloud app serves everything under /api/ on :8000.
    # -------------------------------------------------------------------------

    # SSE streams (executions /events, /topology-stream, recordings
    # /replay/stream, offline /status/stream). SSE REQUIRES buffering OFF and a
    # long read timeout, otherwise nginx holds events back and the live
    # execution/recording view never updates. Regex locations take precedence
    # over the plain `/api/` prefix below.
    location ~ ^/api/.*(/events|/topology-stream|/replay/stream|/status/stream)$ {
        proxy_pass http://127.0.0.1:8000;

        proxy_http_version 1.1;
        proxy_set_header Connection '';          # no keep-alive hop; streaming
        proxy_buffering off;                    # SSE: do NOT buffer events
        proxy_cache off;
        proxy_read_timeout 3600s;               # long-lived streams (1h)
        proxy_send_timeout 3600s;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Regular REST API traffic.
    location /api/ {
        proxy_pass http://127.0.0.1:8000;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Generous timeouts for long-running diagnose/RAG calls.
        proxy_connect_timeout 10s;
        proxy_read_timeout    120s;
        proxy_send_timeout    120s;
    }

    # -------------------------------------------------------------------------
    # Interactive API docs (FastAPI): Swagger UI / ReDoc / OpenAPI schema.
    # Exact-match locations for the pages/schema; a prefix covers docs assets
    # (e.g. /docs/oauth2-redirect). Proxy headers are inlined so this single
    # file is self-contained and passes `nginx -t` with no snippet dependency.
    # -------------------------------------------------------------------------
    location = /docs         { proxy_pass http://127.0.0.1:8000; proxy_http_version 1.1; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme; }
    location = /redoc        { proxy_pass http://127.0.0.1:8000; proxy_http_version 1.1; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme; }
    location = /openapi.json { proxy_pass http://127.0.0.1:8000; proxy_http_version 1.1; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme; }
    location ^~ /docs/       { proxy_pass http://127.0.0.1:8000; proxy_http_version 1.1; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme; }

    # -------------------------------------------------------------------------
    # SPA static assets + history-mode fallback.
    # -------------------------------------------------------------------------
    # Hashed build assets are immutable — let the browser cache them hard.
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        # Vue Router history mode: any unknown path falls back to index.html.
        try_files $uri $uri/ /index.html;
    }
}
