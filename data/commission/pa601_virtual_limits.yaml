# =============================================================================
# PA601-D54A 全量 commissioning —— 虚拟基线限值 overlay (虚拟设备用)
# =============================================================================
#
# 定位
#   计划本体 data/commission/pa601_full_commission.yaml 里 TC-05/06/08/21/22
#   的 value 是【占位】(基准表未给数值), 不能直接用于真板上板, 也不足以在
#   虚拟设备上判定。本 overlay 只覆盖这几步的占位限值, 其余步骤一律沿用计划
#   自带限值。**不改计划 YAML 本体**(overlay 外置), 真板上板前按规格书替换。
#
# 用途
#   scripts/commission_full_virtual.py 在解析计划后, 对每个 step 若 overlay
#   含该 tc_id, 则用 overlay.steps[tc_id].value 替换 params["value"], 再做判定。
#
# 免责
#   下列数值是「虚拟行为模型的确定性基线值」, 非产品规格, 仅用于验证工具链
#   与判据路径活性; 上真板前必须以 PA601 规格书核定后替换。
# =============================================================================
version: "1"
steps:
  tc05_power_sequence:
    value:
      max: 500.0
      unit: ms
    note: "虚拟基线值（turn-on 延迟上限 500ms），非产品规格，上板前按规格书替换"
  tc06_inrush:
    value:
      max: 60.0
      unit: A
    note: "虚拟基线值（输入浪涌峰值上限 60A），非产品规格，上板前按规格书/保险丝 I²t 替换"
  tc08_uvlo:
    value:
      min: 70.0
      max: 90.0
      unit: V
    note: "虚拟基线值（UVLO 阈值 70..90V），非产品规格，上板前按规格书替换"
  tc21_scp:
    value:
      max: 5.0
      unit: s
    note: "虚拟基线值（短路恢复时间上限 5s），非产品规格，上板前按规格书替换"
  tc22_otp:
    value:
      max: 125.0
      unit: "C"
    note: "虚拟基线值（过温触发上限 125C），非产品规格，上板前按规格书替换"
